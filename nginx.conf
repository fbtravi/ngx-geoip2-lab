user  nginx;
worker_processes  1;

error_log  /dev/stderr info;
pid        /var/run/nginx.pid;

load_module /usr/lib/nginx/modules/ngx_http_geoip2_module.so;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /dev/stdout;

    # auto_reload: recarrega a base quando o arquivo muda (mtime/inode/tamanho)
    geoip2 /etc/nginx/geoip/GeoLite2-City.mmdb {
        auto_reload 5s;

        $geoip2_city_name    city names en;
        $geoip2_country_code country iso_code;
        $geoip2_country_name country names en;
    }

    server {
        listen 8080;

        # IP fake para testes: curl -H "X-Test-IP: 8.8.8.8" ...
        real_ip_header     X-Test-IP;
        real_ip_recursive  on;
        set_real_ip_from   0.0.0.0/0;

        location / {
            add_header X-Test-IP $remote_addr always;
            add_header X-GeoIP-Country $geoip2_country_code always;
            add_header X-GeoIP-City $geoip2_city_name always;

            return 200 "OK\n";
        }

        location /geoip {
            default_type application/json;
            return 200 '{"ip":"$remote_addr","country_code":"$geoip2_country_code","country_name":"$geoip2_country_name","city":"$geoip2_city_name"}';
        }
    }
}
